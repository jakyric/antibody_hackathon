# Copy to config/pipeline.yaml and edit. Nothing secret belongs in this file:
# the JapanFold key is read from the environment variable JAPANFOLD_API_KEY.
paths:
  data_dir: ~/data/hackathon-data/her2-trastuzumab   # holds trastuzumab_her2_spr_all_768.csv and tz_her2_facs_3classes_524346.csv.zip
  out_dir: results/run                               # everything the stages write
  crystal: reference/her2_fv_1n8z.cif                # trastuzumab Fv + HER2 domain IV (PDB 1N8Z)
  template_pptx: ~/Documents/PhD/Präsentationen/Template-new.pptx   # only needed for the deck stage

design:
  base_h3: WGSQGFYAYD          # best experimentally tested CDR-H3 (SPR 0.023 nM vs 0.114 nM for WT)
  positions: [2, 3, 4, 8, 9, 10]   # CDR-H3 positions that do not contact HER2 (1, 5, 6, 7 are fixed)
  top_substitutions: 6         # BLOSUM45 recipe: keep the m most likely substitutions per position
  blosum_lambda: 0.25          # the paper's value
  changes_from_base: [3, 4]    # abguard needs >=3 mutations from every known CDR-H3, the base is known
  novelty_min_distance: 3
  shortlist: 36                # diverse H3 shortlist (members differ by >= 3 positions)
  shortlist_min_diff: 3

vernier:
  min_blosum45: 1              # only conservative swaps
  residues: [H94, H93, H47, L36, L46, L49]   # a residue is varied only if it touches a changed H3 position

ridge:
  alpha: 10                    # additive ridge on log10 K_D of the SPR designs (ranking aid only)

validate:
  mode: ssh                    # ssh | local | skip
  ssh_host: user@host          # machine that holds the organisers' abguard build
  ssh_key: ~/.ssh/id_rsa
  abguard_bin: /path/to/abguard
  workdir: /tmp/abguard_work

fold:
  model: opendde-abag          # JapanFold model used for ranking (only one that separated the controls)
  base_url: https://api.japanfold.aiand.com
  job_id: null                 # set to reuse an earlier job instead of submitting a new one
  write_pae: true

contacts:
  getcontacts_dir: gc/getcontacts          # git clone https://github.com/getcontacts/getcontacts
  getcontacts_python: gc/env/bin/python    # python with vmd-python (conda-forge)
  pymol: pymol                             # used to add hydrogens and to renumber chains
  jobs: 8

score:
  scope: all                   # all | filtered: score every fold (needed for the plots) or only designs passing the contacts

rank:
  min_iptm: 0.9
  max_epitope_rmsd: 3.0        # A; C-alpha RMSD of the crystal HER2 epitope after fitting the Fv framework (base loop prediction: 1.3 A)
  min_interface_recall: 0.85   # share of the 27 crystal Fv-HER2 residue pairs recovered
  max_h3_pairs_missing: 1      # of the 6 crystal CDR-H3 - HER2 pairs
  min_h3_rest_recall: 0.80     # share of the crystal CDR-H3-vs-rest pairs recovered
  min_h3_rest_polar_recall: 0.70
  salt_bridge_rule: true       # keep only designs with the R98-pos10 salt bridge, or with both partners mutated
  max_per_h3: 3
  top_n: 20
